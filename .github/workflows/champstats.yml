name: Update champion stats

on:
  schedule:
    - cron: "0 18 * * 2" # 毎週火曜 18:00 UTC（＝水曜 03:00 JST）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: champstats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Regenerate src/champStats.js from CommunityDragon
        run: node scripts/gen-champstats.mjs

      - name: Rebuild single-file bundle
        run: npx vite build

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/champStats.js docs; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/champStats.js docs
          git commit -m "chore: チャンピオン基礎ステータスを最新パッチへ更新 (自動)"
          git push
